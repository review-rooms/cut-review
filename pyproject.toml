[project]
name = "cut-review"
version = "0.1.0"
description = "Review rooms for rendered videos on claude.ai: notes pinned to frames, and the CLI a Claude session uses to apply them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "cut-review contributors" }]
dependencies = []

[project.scripts]
cut-review = "cut_review.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cut_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
